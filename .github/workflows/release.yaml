name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            npm_dir: npm/linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            npm_dir: npm/linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            npm_dir: npm/darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            npm_dir: npm/darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            npm_dir: npm/win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage dist directory
        shell: bash
        run: |
          mkdir -p dist/crsp-${{ matrix.target }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/crsp.exe dist/crsp-${{ matrix.target }}/
          else
            cp target/${{ matrix.target }}/release/crsp dist/crsp-${{ matrix.target }}/
          fi
          cp LICENSE README.md dist/crsp-${{ matrix.target }}/
      - name: Stage npm platform package
        shell: bash
        run: |
          mkdir -p ${{ matrix.npm_dir }}/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/crsp.exe ${{ matrix.npm_dir }}/bin/crsp-bin.exe
          else
            cp target/${{ matrix.target }}/release/crsp ${{ matrix.npm_dir }}/bin/crsp-bin
            chmod +x ${{ matrix.npm_dir }}/bin/crsp-bin
          fi
      - name: Upload npm platform binary
        uses: actions/upload-artifact@v4
        with:
          name: npm-bin-${{ matrix.target }}
          path: ${{ matrix.npm_dir }}/bin
      - name: Create Unix archive
        if: matrix.archive == 'tar.gz'
        run: tar -czf dist/crsp-${{ matrix.target }}.tar.gz -C dist crsp-${{ matrix.target }}
      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/crsp-${{ matrix.target }} -DestinationPath dist/crsp-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/crsp-${{ matrix.target }}.${{ matrix.archive }}

  npm-stage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Download npm platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: npm-bin-*
          path: npm-artifacts
      - name: Restore npm platform binaries
        run: |
          mkdir -p npm/linux-x64/bin npm/linux-arm64/bin npm/darwin-arm64/bin npm/darwin-x64/bin npm/win32-x64/bin
          cp -r npm-artifacts/npm-bin-x86_64-unknown-linux-musl/. npm/linux-x64/bin/
          cp -r npm-artifacts/npm-bin-aarch64-unknown-linux-musl/. npm/linux-arm64/bin/
          cp -r npm-artifacts/npm-bin-aarch64-apple-darwin/. npm/darwin-arm64/bin/
          cp -r npm-artifacts/npm-bin-x86_64-apple-darwin/. npm/darwin-x64/bin/
          cp -r npm-artifacts/npm-bin-x86_64-pc-windows-msvc/. npm/win32-x64/bin/
          chmod +x npm/*/bin/crsp-bin 2>/dev/null || true
          ls -R npm/*/bin
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - name: Publish platform packages on first release
        run: |
          rm -f .first-published
          for dir in npm/darwin-arm64 npm/darwin-x64 npm/linux-x64 npm/linux-arm64 npm/win32-x64; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name" name >/dev/null 2>&1; then
              echo "$name is already registered in npm registry"
            else
              echo "$name is not registered yet, publishing normally for first release"
              (cd "$dir" && npm publish)
              echo "$name" >> .first-published
            fi
          done
      - name: Stage npm packages
        run: |
          # stage後の承認手順: npm stage approve <stage-id>（2FA必須）または npmjs.com のStaged PackagesタブでApprove。CI自動化はしない（2FA必須のため手動が正）。
          npm stage publish
          for dir in npm/darwin-arm64 npm/darwin-x64 npm/linux-x64 npm/linux-arm64 npm/win32-x64; do
            name=$(node -p "require('./$dir/package.json').name")
            if [ -f .first-published ] && grep -Fxq "$name" .first-published; then
              echo "skip stage publish for $name (published normally just before)"
            else
              (cd "$dir" && npm stage publish)
            fi
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
