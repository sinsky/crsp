[tools]
"cargo:cargo-nextest" = "0.9.143"
rust = "1.98.1"

[tasks.fmt]
description = "Format code with rustfmt"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check formatting without modifying files"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy with warnings as errors"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run tests with cargo-nextest"
run = "cargo nextest run"

[tasks."test:doc"]
description = "Run documentation tests"
run = "cargo test --doc"

[tasks.build]
description = "Build the project (debug)"
run = "cargo build"

[tasks."build:release"]
description = "Build the project (release)"
run = "cargo build --release"

[tasks.ci]
description = "Run the full CI pipeline locally"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo nextest run",
  "cargo test --doc",
  "cargo build --release",
]
