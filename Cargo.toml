[package]
name = "google-clasp-rs"
version = "0.1.2"
edition = "2024"
description = "crsp - The Apps Script CLI (Rust port of google/clasp)"
license = "Apache-2.0"
repository = "https://github.com/sinsky/crsp"
homepage = "https://github.com/sinsky/crsp"
readme = "README.md"
documentation = "https://docs.rs/google-clasp-rs"
keywords = ["google-apps-script", "apps-script", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published crate to user-facing material: internal design specs and
# plans, CI workflows, and dev-tooling config stay out of the crates.io tarball.
exclude = [
    "docs/superpowers/**",
    ".github/**",
    "mise.toml",
    "docs/live-verification.md",
]

[[bin]]
name = "crsp"
path = "src/main.rs"

[lib]
name = "google_clasp_rs"
path = "src/lib.rs"

[dependencies]
clap = { version = "~4.5", features = ["derive", "env"] }
clap_complete = "~4.6"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "sync",
    "fs",
    "signal",
] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "json",
    "multipart",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
indexmap = "2"
json5 = "~1.3"
globset = "~0.4"
walkdir = "2"
notify = "8"
demand = "2"
open = "5"
home = "~0.5"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
thiserror = "2"
# O_NOFOLLOW constant for the POSIX credential-file direct write (spec §2.3).
libc = "0.2"
unicode-width = "~0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.2", features = ["server", "client", "macros", "transport-io", "transport-child-process", "transport-async-rw"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
toml = "0.8"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
